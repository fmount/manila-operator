#
# EXECUTION (from install_yamls repo root):
#
#   make manila_kuttl
#
# ASSUMPTIONS:
#
# 1. Latest version of kuttl is installed at /usr/local/bin/kubectl-kuttl
#    - wget https://github.com/kudobuilder/kuttl/releases/download/v0.11.1/kubectl-kuttl_0.11.1_linux_x86_64
#    - mv kubectl-kuttl_0.11.1_linux_x86_64 /usr/local/bin/kubectl-kuttl
#    - chmod 755 /usr/local/bin/kubectl-kuttl
# 2. An OCP 4.10+ CRC cluster with Podified Operators has been deployed
# 3. CLI user has access to $KUBECONFIG
# 4. The environment variable INSTALL_YAMLS is set to the the path of the
#    install_yamls repo

apiVersion: kuttl.dev/v1beta1
kind: TestSuite
reportFormat: xml
reportName: kuttl-report-manila
reportGranularity: test
namespace: manila-kuttl-tests
timeout: 300
parallel: 1
suppress:
   - events
commands:
   # The tests apply the config/samples/layout CRs unmodified, so the service
   # images come from the operator RELATED_IMAGE_* defaults (which the asserts
   # compare the CRs against). When CI provides speculatively built images,
   # rewrite those defaults on the CSV the same way the ci-framework
   # set_openstack_containers role does, and let OLM re-render the controller
   # deployment. The role itself is not usable here: manila_kuttl installs the
   # operator, so it does not exist yet when the pre_kuttl hooks run.
   - timeout: 300
     script: |
        set -eu -o pipefail

        if [ -z "${MANILA_API_IMAGE:-}" ]; then
            echo "No CI provided manila images, keeping the operator defaults"
            exit 0
        fi

        OPERATOR_NAMESPACE=${OPERATOR_NAMESPACE:-openstack-operators}

        # manila_kuttl runs "make wait" before kuttl, so the operator deployment
        # is already available and the CSV exists. The label is attached by OLM
        # separately from the CSV itself, so fall back to matching by name.
        CSV=$(oc get csv -n "${OPERATOR_NAMESPACE}" -o jsonpath='{.items[0].metadata.name}' \
              -l "operators.coreos.com/manila-operator.${OPERATOR_NAMESPACE}" || true)
        if [ -z "${CSV}" ]; then
            CSV=$(oc get csv -n "${OPERATOR_NAMESPACE}" -o name \
                  | sed 's|.*/||' | grep '^manila-operator' | head -1)
        fi
        echo "Rewriting manila image defaults on CSV ${CSV}"

        PATCH=$(mktemp)
        trap 'rm -f "${PATCH}"' EXIT

        # Emit only the deployments array: echoing the whole CSV back would
        # carry metadata.resourceVersion into the merge patch and turn it into
        # an optimistic concurrency check, which races OLM still writing the
        # install status conditions.
        oc get csv -n "${OPERATOR_NAMESPACE}" "${CSV}" -o json \
           | jq --arg api "${MANILA_API_IMAGE}" \
                --arg scheduler "${MANILA_SCHEDULER_IMAGE}" \
                --arg share "${MANILA_SHARE_IMAGE}" \
                '{spec: {install: {spec: {deployments:
                   [ .spec.install.spec.deployments[]
                     | (.spec.template.spec.containers[]?.env[]?
                        | select(.name == "RELATED_IMAGE_MANILA_API_IMAGE_URL_DEFAULT")).value = $api
                     | (.spec.template.spec.containers[]?.env[]?
                        | select(.name == "RELATED_IMAGE_MANILA_SCHEDULER_IMAGE_URL_DEFAULT")).value = $scheduler
                     | (.spec.template.spec.containers[]?.env[]?
                        | select(.name == "RELATED_IMAGE_MANILA_SHARE_IMAGE_URL_DEFAULT")).value = $share
                   ]}}}}' \
           > "${PATCH}"

        oc patch csv -n "${OPERATOR_NAMESPACE}" "${CSV}" --type=merge --patch-file="${PATCH}"

        # OLM re-renders the deployment from the CSV, so poll for the new value
        # rather than racing "oc rollout status" against the old ReplicaSet.
        for _ in $(seq 60); do
            oc get deployment manila-operator-controller-manager -n "${OPERATOR_NAMESPACE}" \
               -o jsonpath='{.spec.template.spec.containers[*].env[?(@.name=="RELATED_IMAGE_MANILA_API_IMAGE_URL_DEFAULT")].value}' \
               | grep -q "${MANILA_API_IMAGE}" && break
            sleep 2
        done
        oc rollout status deployment manila-operator-controller-manager \
           -n "${OPERATOR_NAMESPACE}" --timeout=120s
