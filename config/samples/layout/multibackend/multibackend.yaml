apiVersion: manila.openstack.org/v1beta1
kind: Manila
metadata:
  name: manila
  namespace: openstack
spec:
  manilaAPI:
      customServiceConfig: |
         [DEFAULT]
         enabled_share_protocols=nfs,cifs
  manilaShares:
    share0:
      customServiceConfig: |
         [DEFAULT]
         enabled_share_backends = dummy0
         enabled_share_protocols = NFS,CIFS
         [dummy0]
         driver_handles_share_servers = False
         share_backend_name = dummy0
         share_driver = manila.tests.share.drivers.dummy.DummyDriver
      replicas: 1
    share1:
      customServiceConfig: |
          [DEFAULT]
          enabled_share_backends = dummy1
          enabled_share_protocols = NFS,CIFS
          [dummy1]
          driver_handles_share_servers = False
          share_backend_name = dummy1
          share_driver = manila.tests.share.drivers.dummy.DummyDriver
      replicas: 1
